# Dependabot: keeps the GitHub Actions this repo uses, and its Python packages, up to date.
# Quiet on purpose: once a week, and each kind's updates come together in one pull request.
# Security fixes (turned on in Settings > Code security) still come as soon as they're out.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"  # .github/workflows and the root action.yml
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"  # pyproject.toml
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
