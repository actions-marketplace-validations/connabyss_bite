name: tests

on:
  push:
    branches: [main]
  pull_request:
  # bot/self_check.py starts it on the pull request it opens (GitHub doesn't start checks on those by itself).
  workflow_dispatch:

jobs:
  # Windows and Mac run the tests on 2 machines at once, each taking every other test (--part K/2, slowest first),
  # so they take about half as long; Ubuntu, already quick, runs them all on one. Every test still runs on every OS
  # and Python. The "test (os, python)" jobs below, named like the checks main requires, pass only when all of their
  # parts passed.
  part:
    name: tests part ${{ matrix.part }} (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        part: [1, 2]
        exclude:
          - os: ubuntu-latest
            part: 2
    # GitHub is short on Apple-chip Macs, so macos-latest jobs sit queued and get cancelled.
    # Run the Mac jobs on Intel Macs; the job names (and the required checks) stay the same.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-15-intel' || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Windows has no Python 3.10 built in: setup-python installed it on every run (44 sec of the job). Keep the
      # installed copy between runs; setup-python finds it in the tool cache and only puts it on the path.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: runner.os == 'Windows' && matrix.python == '3.10'
        with:
          path: C:\hostedtoolcache\windows\Python\3.10.*
          key: python-${{ runner.os }}-${{ matrix.python }}-v1
      # Windows: the tests write thousands of small files (practice repos, copies), and the runner's C: drive, where
      # the temp folder is, is the slow one. They write to D: instead. Same tests.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\tmp | Out-Null
          "TMP=D:\tmp" >> $env:GITHUB_ENV
          "TEMP=D:\tmp" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .[test]
      # 4 at a time (pytest-xdist): about 4x faster, most of all on Windows, where each test starts slower (#16).
      - run: python -m pytest -v -n auto --dist worksteal --durations=20 --part ${{ matrix.part }}/${{ matrix.os == 'ubuntu-latest' && 1 || 2 }}
      - name: Note that this part passed
        shell: bash
        run: echo ok > passed.txt
      - uses: actions/upload-artifact@v7
        with:
          name: passed-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.part }}
          path: passed.txt

  test:
    needs: part
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true  # no part passed
        with:
          pattern: passed-${{ matrix.os }}-${{ matrix.python }}-*
          path: passed/
      - name: All parts of the tests passed on ${{ matrix.os }}, Python ${{ matrix.python }}
        shell: bash
        run: |
          want=${{ matrix.os == 'ubuntu-latest' && 1 || 2 }}
          n=$(find passed -name passed.txt 2>/dev/null | wc -l)
          echo "$n of $want parts passed"
          [ "$n" -eq "$want" ] || { echo "::error::A half of the tests failed (or didn't run) on this OS and Python: see its tests part job."; exit 1; }
