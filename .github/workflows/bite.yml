name: bite

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  bite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Only the test runner: Bite is installed on its own by the action, so the tests import each copy's code.
      - run: python -m pip install pytest pytest-xdist
      - uses: ./
        with:
          # .bite.ini runs the tests 4 at a time, --jobs 2 checks 2 commits at once (a run that fails beside the
          # other counts only if it fails again alone), and a smaller piece-check budget keeps this to a few minutes.
          # The action remembers commits it already checked on this pull request, so a new push checks only new ones.
          args: --part-runs 2 --jobs 2
